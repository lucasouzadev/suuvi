name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tokens:
    name: tokens + fixtures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Contraste WCAG AA
        run: python3 scripts/contrast.py design/tokens.json
      - name: Tokens e icones gerados estao em dia
        run: |
          python3 scripts/gen_tokens.py
          python3 scripts/gen_icons.py
          test -z "$(git status --porcelain -- ios/Suuvi/Design android/app/src/main/java/app/suuvi/design ios/Suuvi/Assets.xcassets android/app/src/main/res/drawable)" || { git status --porcelain; echo "gerados fora de dia: rode scripts/gen_tokens.py e scripts/gen_icons.py"; exit 1; }
      - name: Emojis da lista curada existem nas duas plataformas
        run: python3 scripts/check_emojis.py
      - name: Fixtures validos
        run: |
          python3 - <<'PY'
          import json
          f = json.load(open("fixtures/numbering.json"))
          nxt = lambda e, l=0: max(max(e, default=0), l) + 1
          bad = [c["name"] for c in f["cases"] if nxt(c["existing"], c.get("lastIssued", 0)) != c["expect"]]
          assert not bad, bad
          print("fixtures ok:", len(f["cases"]))
          PY

  ios:
    name: ios (simulador)
    runs-on: macos-26
    needs: tokens
    steps:
      - uses: actions/checkout@v4
      - name: XcodeGen
        run: brew install xcodegen
      - name: Gerar projeto
        run: xcodegen generate --spec ios/project.yml --project ios
      - name: Criar simulador iPhone (runtime mais recente)
        id: sim
        run: |
          RUNTIME=$(xcrun simctl list runtimes iOS -j | jq -r '[.runtimes[] | select(.isAvailable)] | last | .identifier')
          TYPE=$(xcrun simctl list devicetypes -j | jq -r '[.devicetypes[] | select(.name | startswith("iPhone 1"))] | last | .identifier')
          UDID=$(xcrun simctl create "suuvi-ci" "$TYPE" "$RUNTIME")
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          echo "Runtime: $RUNTIME  Device: $TYPE  UDID: $UDID"
      - name: Testes no simulador
        run: |
          set -o pipefail
          mkdir -p ios/build
          xcodebuild test \
            -project ios/Suuvi.xcodeproj -scheme Suuvi \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath ios/build | tee ios/build/test.log | tail -40
      - name: Abrir o app no simulador e tirar print
        run: |
          APP=$(find ios/build/Build/Products -name 'Suuvi.app' -path '*iphonesimulator*' -maxdepth 4 | head -1)
          echo "app: $APP"
          xcrun simctl boot "${{ steps.sim.outputs.udid }}"
          xcrun simctl bootstatus "${{ steps.sim.outputs.udid }}" -b
          xcrun simctl install "${{ steps.sim.outputs.udid }}" "$APP"
          xcrun simctl launch "${{ steps.sim.outputs.udid }}" app.suuvi.Suuvi
          sleep 5
          xcrun simctl io "${{ steps.sim.outputs.udid }}" screenshot ios-shelf.png
          xcrun simctl terminate "${{ steps.sim.outputs.udid }}" app.suuvi.Suuvi
          xcrun simctl launch "${{ steps.sim.outputs.udid }}" app.suuvi.Suuvi -startRoute folders
          sleep 5
          xcrun simctl io "${{ steps.sim.outputs.udid }}" screenshot ios-folders.png
          xcrun simctl terminate "${{ steps.sim.outputs.udid }}" app.suuvi.Suuvi
          xcrun simctl launch "${{ steps.sim.outputs.udid }}" app.suuvi.Suuvi -startRoute collection
          sleep 5
          xcrun simctl io "${{ steps.sim.outputs.udid }}" screenshot ios-collection.png
          xcrun simctl terminate "${{ steps.sim.outputs.udid }}" app.suuvi.Suuvi
          xcrun simctl launch "${{ steps.sim.outputs.udid }}" app.suuvi.Suuvi -startRoute edit
          sleep 5
          xcrun simctl io "${{ steps.sim.outputs.udid }}" screenshot ios-edit.png
          xcrun simctl terminate "${{ steps.sim.outputs.udid }}" app.suuvi.Suuvi
          xcrun simctl launch "${{ steps.sim.outputs.udid }}" app.suuvi.Suuvi -startRoute editdone
          sleep 5
          xcrun simctl io "${{ steps.sim.outputs.udid }}" screenshot ios-editdone.png
          xcrun simctl terminate "${{ steps.sim.outputs.udid }}" app.suuvi.Suuvi
          xcrun simctl launch "${{ steps.sim.outputs.udid }}" app.suuvi.Suuvi -startRoute profile
          sleep 6
          xcrun simctl io "${{ steps.sim.outputs.udid }}" screenshot ios-profile.png
          xcrun simctl terminate "${{ steps.sim.outputs.udid }}" app.suuvi.Suuvi
          xcrun simctl launch "${{ steps.sim.outputs.udid }}" app.suuvi.Suuvi -startRoute settings
          sleep 5
          xcrun simctl io "${{ steps.sim.outputs.udid }}" screenshot ios-settings.png
          xcrun simctl terminate "${{ steps.sim.outputs.udid }}" app.suuvi.Suuvi
          xcrun simctl launch "${{ steps.sim.outputs.udid }}" app.suuvi.Suuvi -startRoute capture
          sleep 5
          xcrun simctl io "${{ steps.sim.outputs.udid }}" screenshot ios-capture.png
          xcrun simctl terminate "${{ steps.sim.outputs.udid }}" app.suuvi.Suuvi
          xcrun simctl launch "${{ steps.sim.outputs.udid }}" app.suuvi.Suuvi -startRoute capturelifted
          sleep 25
          xcrun simctl io "${{ steps.sim.outputs.udid }}" screenshot ios-capturelifted.png
          xcrun simctl terminate "${{ steps.sim.outputs.udid }}" app.suuvi.Suuvi
          xcrun simctl launch "${{ steps.sim.outputs.udid }}" app.suuvi.Suuvi -startRoute search
          sleep 5
          xcrun simctl io "${{ steps.sim.outputs.udid }}" screenshot ios-search.png
          xcrun simctl terminate "${{ steps.sim.outputs.udid }}" app.suuvi.Suuvi
          xcrun simctl launch "${{ steps.sim.outputs.udid }}" app.suuvi.Suuvi -startRoute viewer
          sleep 6
          xcrun simctl io "${{ steps.sim.outputs.udid }}" screenshot ios-viewer.png
      - uses: actions/upload-artifact@v4
        with:
          name: ios-screens
          path: ios-*.png

  android:
    name: android (testes + apk)
    runs-on: ubuntu-latest
    needs: tokens
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"
      - name: Testes unitarios e APK debug
        run: gradle -p android :app:testDebugUnitTest :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

  android-emulator:
    name: android (emulador)
    runs-on: ubuntu-latest
    needs: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"
      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Emulador, instalar, abrir e tirar print
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          script: |
            gradle -p android :app:installDebug
            adb shell am start -S -n app.suuvi/.MainActivity
            sleep 5
            adb exec-out screencap -p > android-shelf.png
            adb shell am start -S -n app.suuvi/.MainActivity --es route folders
            sleep 5
            adb exec-out screencap -p > android-folders.png
            adb shell am start -S -n app.suuvi/.MainActivity --es route collection
            sleep 5
            adb exec-out screencap -p > android-collection.png
            adb shell am start -S -n app.suuvi/.MainActivity --es route edit
            sleep 5
            adb exec-out screencap -p > android-edit.png
            adb shell am start -S -n app.suuvi/.MainActivity --es route editdone
            sleep 5
            adb exec-out screencap -p > android-editdone.png
            adb shell am start -S -n app.suuvi/.MainActivity --es route profile
            sleep 6
            adb exec-out screencap -p > android-profile.png
            adb shell am start -S -n app.suuvi/.MainActivity --es route settings
            sleep 5
            adb exec-out screencap -p > android-settings.png
            adb shell am start -S -n app.suuvi/.MainActivity --es route capture
            sleep 5
            adb exec-out screencap -p > android-capture.png
            adb shell am start -S -n app.suuvi/.MainActivity --es route capturelifted
            sleep 100
            adb exec-out screencap -p > android-capturelifted.png
            adb logcat -d -s suuvi:W '*:S' > android-lift-log.txt || true; adb logcat -d | grep -i -E 'mlkit|subject|optional module|dynamite' | tail -40 >> android-lift-log.txt || true
            adb shell am start -S -n app.suuvi/.MainActivity --es route search
            sleep 5
            adb exec-out screencap -p > android-search.png
            adb shell am start -S -n app.suuvi/.MainActivity --es route viewer
            sleep 6
            adb exec-out screencap -p > android-viewer.png
      - uses: actions/upload-artifact@v4
        with:
          name: android-screens
          path: |
            android-*.png
            android-*.txt
